<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CivicSense · Dibrugarh University</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#F6F9F7;--sf:#fff;--tx:#18352F;--t2:#72847E;--pr:#073E34;--em:#087F65;--mt:#45B69C;--wn:#EAB75A;--cr:#D76B64;--bd:#DDE7E3;--on:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0C1815;--sf:#13241F;--tx:#E5F0EC;--t2:#8FA39C;--pr:#45B69C;--em:#45B69C;--bd:#24403A;--on:#073E34}}
:root[data-theme=dark]{--bg:#0C1815;--sf:#13241F;--tx:#E5F0EC;--t2:#8FA39C;--pr:#45B69C;--em:#45B69C;--bd:#24403A;--on:#073E34}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 Inter,"Noto Sans Bengali",sans-serif}
h1,h2,h3{font-family:"Plus Jakarta Sans","Noto Sans Bengali",sans-serif;margin:0;letter-spacing:-.02em}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--mt);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px;padding:10px 20px;flex-wrap:wrap}
.logo{font:800 19px "Plus Jakarta Sans";color:var(--pr);margin-right:auto}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav a,.btn{padding:8px 13px;border-radius:9px;font-weight:500;border:0;cursor:pointer;font-size:14px;background:none;color:var(--tx)}
nav a:hover{background:var(--bg)}nav a.on{background:var(--pr);color:var(--on)}
.btn{background:var(--em);color:#fff;display:inline-block}.btn.ghost{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}
.btn.sm{padding:5px 10px;font-size:13px}.btn.danger{background:var(--cr)}
main{max-width:1100px;margin:0 auto;padding:28px 20px 60px}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;align-items:center;padding:36px 0}
.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.05;color:var(--pr)}
.hero p{color:var(--t2);font-size:18px;max-width:46ch}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:18px}
.kpi b{display:block;font:800 32px "Plus Jakarta Sans";color:var(--pr)}.kpi span{color:var(--t2);font-size:13px}
.two{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-top:16px}
h2{font-size:24px;margin:6px 0 16px}h3{font-size:16px;margin-bottom:10px}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit}
.err{color:var(--cr);font-size:13px;min-height:18px}
.badge{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.s-new{background:#e3f3ee;color:#087F65}.s-pending{background:#fbf0d6;color:#8a6410}.s-progress{background:#dfeaf7;color:#2a5a94}.s-resolved{background:#dff3df;color:#2d7a3a}
.p-critical{color:var(--cr)}.p-high{color:#b9801a}.p-medium{color:var(--em)}.p-low{color:var(--t2)}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--bd)}th{color:var(--t2);font-weight:500}
.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--em)}
.steps{display:flex;gap:8px;margin-bottom:14px}.steps span{flex:1;height:5px;border-radius:9px;background:var(--bd)}.steps .on{background:var(--em)}
.demo{background:#fbf0d6;color:#6b4d0c;padding:6px 10px;border-radius:8px;font-size:12px;margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tl{border-left:2px solid var(--bd);padding-left:16px;margin-left:6px}.tl div{margin-bottom:12px;position:relative}.tl div:before{content:"";position:absolute;left:-23px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--em)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--pr);color:var(--on);padding:10px 18px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
.empty{text-align:center;color:var(--t2);padding:30px}.dz{display:block;border:2px dashed var(--bd);border-radius:14px;padding:28px;text-align:center;color:var(--t2);cursor:pointer}.dz.over,.dz:hover{border-color:var(--em);background:var(--bg)}.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:14px 0}.thumbs div{position:relative}.thumbs img,.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--bd)}.thumbs button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:24px;height:24px;background:var(--cr);color:#fff;cursor:pointer}.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:12px}
svg text{fill:var(--t2);font-size:11px}
main.full{max-width:none;padding:0}.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}.sb{background:#073E34;color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh}.bl{display:flex;gap:10px;align-items:center;font:800 17px "Plus Jakarta Sans";padding:0 8px}.bl small{display:block;font:400 11px Inter;opacity:.7}.sb nav{flex-direction:column;gap:3px;margin-top:8px}.sb nav a{color:#cfe6df;padding:10px 12px}.sb nav a:hover{background:#0b5245}.sb nav a.on{background:#087F65;color:#fff}.lo{margin-top:auto;color:#cfe6df;padding:10px 12px;border-radius:9px}.ct{padding:20px 28px 50px;min-width:0}.tb{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-bottom:6px}.av{width:34px;height:34px;border-radius:50%;background:#087F65;color:#fff;display:grid;place-items:center;font-weight:700}.ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none}.kc{display:flex;gap:12px;align-items:center}.kc b{font:800 28px "Plus Jakarta Sans";display:block;line-height:1}.kc small{color:var(--t2)}.rw{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.rw img,.tph{width:54px;height:44px;border-radius:8px;object-fit:cover;background:var(--bg);display:grid;place-items:center;font-size:20px;flex:none}.sp{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:16px}.rg{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}.rg .card{max-width:none!important}.split{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}.lp{background:#073E34;color:#fff;display:flex;flex-direction:column;justify-content:space-between;gap:20px;padding:32px}.lp h2{font-size:32px;max-width:14ch}.lp svg,.card svg.bd{width:100%;border-radius:14px}.rp{display:grid;place-items:center;padding:30px;background:var(--sf)}.tabs{display:flex;border-bottom:1px solid var(--bd);margin:14px 0}.tabs button{flex:1;padding:10px;border:0;background:none;color:var(--t2);font-weight:600;cursor:pointer;border-bottom:2px solid transparent}.tabs .on{color:var(--em);border-color:var(--em)}.pill{padding:2px 9px;border-radius:7px;font-size:12px;background:var(--bg);font-weight:600}.chips button{border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:9px;padding:6px 12px;cursor:pointer;margin-right:6px}.chips .on{background:var(--em);color:#fff;border-color:var(--em)}.hb{display:inline-block;background:#e3f3ee;color:#087F65;padding:4px 12px;border-radius:99px;font-weight:600;font-size:13px}.tl .pd{opacity:.55}.tl .pd:before{background:var(--bd)}.mapw svg{width:100%;border-radius:14px;border:1px solid var(--bd)}.mapw [data-pin]{cursor:pointer}
@media(max-width:760px){.shell,.sp,.rg,.split{grid-template-columns:1fr}.sb{position:static;height:auto}.sb nav{flex-direction:row;flex-wrap:wrap}.lp{display:none}.hero{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <a class="logo" href="#home">🌿 CivicSense</a>
  <nav id="nav" aria-label="Main"></nav>
  <button class="btn ghost sm" id="lang" aria-label="Switch language">অসমীয়া</button>
  <button class="btn ghost sm" id="theme" aria-label="Toggle theme">◐</button>
</header>
<main id="app" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const T={en:{home:"Home",login:"Sign in",sd:"My dashboard",sr:"Report issue",sc:"My complaints",ad:"Admin dashboard",ac:"Complaints",adup:"Duplicates",out:"Sign out",
 h1:"Your Voice. A Better Campus.",sub:"An intelligent bilingual platform that transforms campus concerns into meaningful action.",rep:"Report an issue",exp:"Explore the admin view",
 tot:"Total",pend:"Pending",prog:"In progress",res:"Resolved",crit:"Critical",rate:"Resolution rate",avg:"Avg. resolution (days)",
 title:"Complaint title",desc:"Description",cat:"Category",loc:"Campus location",lng:"Language",anon:"Report anonymously",next:"Continue",back:"Back",submit:"Submit complaint",
 ai:"AI analysis preview",demo:"Demo content: rule-based simulation, not a real AI model.",empty:"No complaints yet. Report your first issue.",
 req:"Required (min 5 characters)",sub2:"Submitted",who:"Sign in as",stu:"Student",adm:"Administrator",search:"Search complaints",all:"All",merge:"Merge",unrel:"Mark unrelated",csv:"Export CSV"},
as:{home:"ঘৰ",login:"সোমাওক",sd:"মোৰ ডেচব’ৰ্ড",sr:"সমস্যা জনাওক",sc:"মোৰ অভিযোগ",ad:"প্ৰশাসক ডেচব’ৰ্ড",ac:"অভিযোগসমূহ",adup:"দ্বৈত অভিযোগ",out:"ওলাই যাওক",
 h1:"আপোনাৰ মাত। এখন উন্নত কেম্পাছ।",sub:"এক বুদ্ধিমান দ্বিভাষিক মঞ্চ যিয়ে কেম্পাছৰ চিন্তাক অৰ্থপূৰ্ণ কাৰ্যলৈ ৰূপান্তৰিত কৰে।",rep:"সমস্যা জনাওক",exp:"প্ৰশাসক দৃশ্য চাওক",
 tot:"মুঠ",pend:"অপেক্ষাৰত",prog:"চলি আছে",res:"সমাধান হৈছে",crit:"জৰুৰী",rate:"সমাধানৰ হাৰ",avg:"গড় সময় (দিন)",
 title:"অভিযোগৰ শিৰোনাম",desc:"বিৱৰণ",cat:"শ্ৰেণী",loc:"স্থান",lng:"ভাষা",anon:"নাম নজনোৱাকৈ",next:"আগবাঢ়ক",back:"পিছলৈ",submit:"অভিযোগ দাখিল কৰক",
 ai:"AI বিশ্লেষণৰ পূৰ্বদৰ্শন",demo:"ডেম’ বিষয়বস্তু: নিয়মভিত্তিক অনুকৰণ, প্ৰকৃত AI নহয়।",empty:"এতিয়ালৈকে কোনো অভিযোগ নাই।",
 req:"আৱশ্যকীয় (কমেও ৫ আখৰ)",sub2:"দাখিল কৰা হ’ল",who:"হিচাপে সোমাওক",stu:"ছাত্ৰ",adm:"প্ৰশাসক",search:"অভিযোগ বিচাৰক",all:"সকলো",merge:"একত্ৰ কৰক",unrel:"সম্পৰ্কহীন",csv:"CSV ৰপ্তানি"}};
const CATS=["Water","Electricity","Wi-Fi","Hostel","Safety","Library","Sanitation"];
const DEPT={Water:"Estate Office",Electricity:"Electrical Cell","Wi-Fi":"IT Centre",Hostel:"Hostel Warden",Safety:"Security Office",Library:"Library",Sanitation:"Estate Office"};
const LOCS=["Main Gate","Central Library","Boys Hostel","Girls Hostel","Science Block","Admin Building"];
const SEED=[
["CS-1001","Water tank overflowing near hostel","Boys Hostel","Water","high","progress","2026-07-04"],
["CS-1002","Wi-Fi down in library reading room","Central Library","Wi-Fi","medium","pending","2026-07-19"],
["CS-1003","Streetlight broken at main gate","Main Gate","Electricity","critical","new","2026-08-02"],
["CS-1004","Streetlight not working near main gate","Main Gate","Electricity","high","new","2026-08-03"],
["CS-1005","Dirty washrooms in science block","Science Block","Sanitation","medium","resolved","2026-08-11"],
["CS-1006","Poor lighting on girls hostel road","Girls Hostel","Safety","critical","progress","2026-09-06"],
["CS-1007","Slow internet in hostel","Boys Hostel","Wi-Fi","low","resolved","2026-09-15"],
["CS-1008","Water supply cut in admin building","Admin Building","Water","high","pending","2026-10-01"],
["CS-1009","Library AC not cooling","Central Library","Library","low","resolved","2026-10-12"],
["CS-1010","Overflowing bins near science block","Science Block","Sanitation","medium","new","2026-10-24"]
].map((r,i)=>({id:r[0],title:r[1],loc:r[2],cat:r[3],pri:r[4],st:r[5],date:r[6],desc:"Reported by a student. Demo record.",dept:DEPT[r[3]],mine:i%2==0,hist:[{s:"new",d:r[6]}]}));
const $=s=>document.querySelector(s);
const ST={lang:localStorage.lang||"en",user:JSON.parse(localStorage.user||"null"),data:JSON.parse(localStorage.cs_data||"null")||SEED,dups:JSON.parse(localStorage.cs_dups||"null")||[],draft:{step:1}};
try{}catch(e){}
const save=()=>{try{localStorage.cs_data=JSON.stringify(ST.data);localStorage.cs_dups=JSON.stringify(ST.dups);localStorage.lang=ST.lang;localStorage.user=JSON.stringify(ST.user)}catch(e){}};
const t=k=>T[ST.lang][k]||k;
const toast=m=>{const e=$("#toast");e.textContent=m;e.className="show";setTimeout(()=>e.className="",2200)};
const lbl={new:"New",pending:"Pending",progress:"In progress",resolved:"Resolved"};
const badge=s=>`<span class="badge s-${s}">${lbl[s]}</span>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mine=()=>ST.data.filter(c=>c.mine);
/* ---- charts (inline SVG) ---- */
function bars(obj,color="var(--em)"){const e=Object.entries(obj),m=Math.max(1,...e.map(x=>x[1])),w=100/e.length;
 return `<svg viewBox="0 0 300 150" role="img" aria-label="Bar chart">${e.map(([k,v],i)=>{const h=v/m*100;return `<g><title>${k}: ${v}</title><rect x="${i*300/e.length+8}" y="${115-h}" width="${300/e.length-16}" height="${h}" rx="4" fill="${color}"/><text x="${i*300/e.length+(300/e.length)/2}" y="${112-h}" text-anchor="middle">${v}</text><text x="${i*300/e.length+(300/e.length)/2}" y="135" text-anchor="middle">${k.slice(0,7)}</text></g>`}).join("")}</svg>`}
function donut(obj){const cols=["#073E34","#087F65","#45B69C","#EAB75A","#D76B64","#72847E","#9ED6C7"],e=Object.entries(obj),tot=e.reduce((a,x)=>a+x[1],0)||1;let off=0;
 const r=40,C=2*Math.PI*r;
 const arcs=e.map(([k,v],i)=>{const l=v/tot*C,s=`<circle r="${r}" cx="60" cy="60" fill="none" stroke="${cols[i%7]}" stroke-width="18" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"><title>${k}: ${v}</title></circle>`;off+=l;return s}).join("");
 return `<div class="row"><svg viewBox="0 0 120 120" width="150" role="img" aria-label="Donut chart">${arcs}<text x="60" y="64" text-anchor="middle" style="font-size:16px;fill:var(--tx);font-weight:700">${tot}</text></svg><div>${e.map(([k,v],i)=>`<div><span style="color:${cols[i%7]}">●</span> ${k} <b>${v}</b></div>`).join("")}</div></div>`}
function line(pts){const m=Math.max(1,...pts.map(p=>p[1])),n=pts.length;const xy=pts.map((p,i)=>[20+i*(260/Math.max(1,n-1)),110-p[1]/m*90]);
 return `<svg viewBox="0 0 300 150" role="img" aria-label="Line chart"><polyline fill="none" stroke="var(--em)" stroke-width="3" points="${xy.map(p=>p.join(",")).join(" ")}"/>${xy.map((p,i)=>`<g><title>${pts[i][0]}: ${pts[i][1]}</title><circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--em)"/><text x="${p[0]}" y="135" text-anchor="middle">${pts[i][0]}</text></g>`).join("")}</svg>`}
const count=(a,f)=>a.reduce((o,x)=>(o[f(x)]=(o[f(x)]||0)+1,o),{});
/* ---- pages ---- */
const P={};
P.home=()=>`<section class="hero"><div><h1>${t("h1")}</h1><p>${t("sub")}</p><div class="row" style="margin-top:22px"><a class="btn" href="#student-report">${t("rep")}</a><a class="btn ghost" href="#admin-dashboard">${t("exp")}</a></div></div>
<div class="card" aria-hidden="true"><h3>Live preview</h3>${bars(count(ST.data,c=>c.cat))}</div></section>
<div class="grid">${[["Bilingual","Report in Assamese or English; summaries in both."],["Smart routing","Each issue goes to the responsible department."],["Live tracking","Follow every complaint from filing to resolution."],["Duplicate detection","Similar reports are grouped so work isn’t repeated."]].map(f=>`<div class="card"><h3>${f[0]}</h3><p style="margin:0;color:var(--t2)">${f[1]}</p></div>`).join("")}</div>`;
P.login=()=>`<div class="card" style="max-width:420px;margin:30px auto"><h2>${t("login")}</h2><p style="color:var(--t2)">Demo sign-in. No real authentication.</p>
<div class="row"><button class="btn" data-login="student">${t("who")} ${t("stu")}</button><button class="btn ghost" data-login="admin">${t("who")} ${t("adm")}</button></div></div>`;
const kpis=a=>{const r=a.filter(c=>c.st=="resolved").length;return [[t("tot"),a.length],[t("pend"),a.filter(c=>c.st=="pending"||c.st=="new").length],[t("prog"),a.filter(c=>c.st=="progress").length],[t("res"),r]]};
const kpiHtml=k=>`<div class="grid">${k.map(x=>`<div class="card kpi"><b>${x[1]}</b><span>${x[0]}</span></div>`).join("")}</div>`;
const list=a=>a.length?a.map(c=>`<a class="card" style="display:block;margin-bottom:10px" href="#c-${c.id}"><div class="row"><b>${esc(c.title)}</b>${badge(c.st)}<span class="p-${c.pri}">${c.pri}</span></div><small style="color:var(--t2)">${c.id} · ${esc(c.loc)} · ${c.date}</small></a>`).join(""):`<div class="card empty">${t("empty")}</div>`;
P["student-dashboard"]=()=>{const a=mine(),r=a.filter(c=>c.st=="resolved").length;return `<h2>${t("sd")}</h2>${kpiHtml(kpis(a))}
<div class="two"><div class="card"><h3>Status</h3>${donut(count(a,c=>lbl[c.st]))}</div><div class="card"><h3>${t("rate")}</h3><div class="kpi"><b>${a.length?Math.round(r/a.length*100):0}%</b></div><div class="bar"><i style="width:${a.length?r/a.length*100:0}%"></i></div></div></div>
<h3 style="margin-top:22px">Recent</h3>${list(a.slice(-4).reverse())}<a class="btn" href="#student-report">${t("rep")}</a>`};
P["student-complaints"]=()=>`<h2>${t("sc")}</h2>${list(mine().slice().reverse())}`;
function analyze(d){const x=(d.title+" "+d.desc).toLowerCase();let cat=d.cat;
 for(const [k,w] of [["Electricity",/light|power|electric|বিজুলী/],["Water",/water|tap|tank|পানী/],["Wi-Fi",/wifi|wi-fi|internet|network/],["Safety",/unsafe|theft|dark|safety/],["Sanitation",/dirty|bin|toilet|washroom/]]) if(w.test(x)){cat=k;break}
 const pri=/unsafe|fire|danger|shock|critical/.test(x)?"critical":/broken|no |not working|cut/.test(x)?"high":"medium";
 const dup=ST.data.filter(c=>c.loc==d.loc&&c.cat==cat&&c.st!="resolved");
 return {cat,pri,lang:/[\u0980-\u09FF]/.test(x)?"Assamese":"English",dept:DEPT[cat],conf:Math.min(95,60+Math.floor(x.length/4)),dup}}
P["student-report"]=()=>{const d=ST.draft,s=d.step;let body="";

document.addEventListener("click",e=>{const y=scrollY,p=e.target.closest("[data-pin]");if(p){MSEL=p.dataset.pin;render();scrollTo(0,y)}const r=e.target.closest("[data-rq]");if(r){RQ=r.dataset.rq;render()}const l=e.target.closest("[data-lt]");if(l){LT=l.dataset.lt;render()}if(e.target.id=="out")render()});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.dataset&&e.target.dataset.pin){const y=scrollY;MSEL=e.target.dataset.pin;render();scrollTo(0,y)}});
document.addEventListener("change",e=>{const m=e.target.dataset&&e.target.dataset.mc;if(m){const y=scrollY;e.target.checked?MC.add(m):MC.delete(m);render();scrollTo(0,y)}});
function addFiles(fs){const d=ST.draft;d.photos=d.photos||[];let msg="";const jobs=[];
 for(const f of fs){if(d.photos.length+jobs.length>=4){msg="You can add up to 4 photos.";break}
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)){msg=f.name+": use a JPG, PNG or WebP image.";continue}
  if(f.size>5*1048576){msg=f.name+" is larger than 5 MB.";continue}
  jobs.push(new Promise(ok=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const s=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",.7))};im.onerror=()=>ok(null);im.src=u}))}
 Promise.all(jobs).then(r=>{d.photos.push(...r.filter(Boolean));render();if(msg)$("#e-img").textContent=msg;else if(r.length)toast(r.length+" photo(s) added")})}
document.addEventListener("change",e=>{if(e.target.id=="f-img")addFiles([...e.target.files])});
document.addEventListener("dragover",e=>{if(e.target.closest&&e.target.closest("#dz")){e.preventDefault();$("#dz").classList.add("over")}});
document.addEventListener("dragleave",e=>{const z=$("#dz");if(z)z.classList.remove("over")});
document.addEventListener("drop",e=>{if(e.target.closest&&e.target.closest("#dz")){e.preventDefault();addFiles([...e.dataTransfer.files])}});
render();
</script>
</body>
</html>
